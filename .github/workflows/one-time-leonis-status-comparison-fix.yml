name: One-time Leonis status comparison correction

on:
  push:
    paths:
      - '.github/workflows/one-time-leonis-status-comparison-fix.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply scoped correction
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('manuscript/side-stories/レオニス/002-第2話-政治家.md'): [(
                  '「アイリスも自由民だった」\n\n「はい」\n\n「なら、市の立場も分かったのでは」\n\n「同じ身分であることと、同じ経験を持つことは同じではありません」\n\n「アイリスと市は、別の人です」',
                  '「アイリスは自由民だった」\n\n「はい」\n\n「市は？」\n\n「その時は奴隷でした」\n\n「なら、立場は違う」\n\n「はい」\n\n「レオニスは、その違いを知っていた？」\n\n「確認できません」'
              )],
              Path('canon/52_SIDE_STORY_LEONIS_REGISTERED_CANON.md'): [(
                  'アイリスと市は同じ自由民だが、同じ身分が同じ経験を意味するとはしない。同一職業を根拠とする対比は行わない。',
                  'アイリスは自由民であり、市はレオニスとの接触時には奴隷である。両者の法的身分と立場は異なる。同一職業又は同一身分を根拠とする対比は行わない。'
              )],
              Path('manuscript/management/外伝-レオニス-登録台帳.md'): [(
                  '現行の対比。\n\n- 二人とも自由民。\n- 同じ身分が同じ経験を意味するとはしない。\n- アイリスと市は別人。',
                  '現行の対比。\n\n- アイリスは自由民。\n- 市はレオニスとの接触時には奴隷。\n- 両者の法的身分と立場は異なる。\n- アイリスと市は別人。'
              )],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one exact match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/one-time-leonis-status-comparison-fix.yml')
          workflow.unlink()

      - name: Commit scoped correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'manuscript/side-stories/レオニス/002-第2話-政治家.md' \
            'canon/52_SIDE_STORY_LEONIS_REGISTERED_CANON.md' \
            'manuscript/management/外伝-レオニス-登録台帳.md' \
            '.github/workflows/one-time-leonis-status-comparison-fix.yml'
          git commit -m "Correct Leonis episode 2 status comparison"
          git push origin HEAD:main
