name: Final accident date line correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-accident-date-final-line.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining stale sentence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('canon/48_CHAPTER_33_REGISTERED_CANON.md')
          text = path.read_text(encoding='utf-8')
          old = '事故の正しい年月日は確定しない。'
          new = '原子炉重大事故日は1611年11月29日と確定する。'
          if old not in text:
              raise SystemExit('Expected stale sentence not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          workflow = Path('.github/workflows/one-time-accident-date-final-line.yml')
          workflow.unlink()
          PY
      - name: Commit final correction
        shell: bash
        run: |
          git diff --check
          git config user.name "openai-canon-editor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- canon/48_CHAPTER_33_REGISTERED_CANON.md .github/workflows/one-time-accident-date-final-line.yml
          git commit -m "Remove final stale accident date sentence"
          git push origin HEAD:main
