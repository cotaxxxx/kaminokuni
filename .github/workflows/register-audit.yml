name: Register audit supplement

on:
  push:
    branches:
      - canon/full-audit-supplement-date-lake-index-20260806

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply registered corrections
        run: python scripts/register_audit.py
      - name: Commit registered corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            manuscript/chapters/13-光の重さ/035-第35話-光の重さ.md \
            manuscript/chapters/14-黒い壁/038-第38話-一人残れ.md \
            manuscript/chapters/14-黒い壁/039-第39話-最初の記録.md \
            manuscript/chapters/14-黒い壁/040-第40話-地図の外.md \
            manuscript/chapters/15-石/041-第41話-山の口.md \
            manuscript/chapters/16-南方の陸地/046-第46話-森本左近.md \
            manuscript/chapters/17-帰還/050-第50話-手紙.md \
            manuscript/side-stories/市/004-第4話-旅立ち.md \
            manuscript/INDEX.md \
            .github/workflows/register-audit.yml \
            scripts/register_audit.py
          git commit -m "全話監査補足の本文・湖名・INDEX修正を登録"
          git push origin HEAD
