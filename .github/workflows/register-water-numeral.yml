name: Register WATER numeral rule 1.1

on:
  push:
    branches:
      - canon/water-numeral-rule-1-1-episodes-91-92-93-96-20260806

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved files
        run: python scripts/register_water_numeral.py
      - name: Commit registered files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "第91・92・93・96話へ数字規則1.1を適用し優先正典登録"
          git push origin HEAD
